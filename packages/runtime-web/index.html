<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1117" />
    <title>Ludelier — Café Encounter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1117;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
      }
      #app canvas {
        /* Cap at the logical stage size: on high-DPI screens the canvas' intrinsic
           (backing-store) size is devicePixelRatio× larger, but it must still display
           at 1280×720 CSS px, shrinking aspect-preserved on smaller viewports. */
        max-width: min(100vw, 1280px);
        max-height: min(100vh, 720px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
